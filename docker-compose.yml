services:
  postgres:
    image: postgres:17-alpine
    container_name: clientstatus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clientstatus
      POSTGRES_PASSWORD: clientstatus
      POSTGRES_DB: clientstatus
    ports:
      # 5432–5434 are taken by other local projects.
      - "5435:5432"
    volumes:
      - clientstatus-pg:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientstatus -d clientstatus"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  clientstatus-pg:
